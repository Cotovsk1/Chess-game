<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Налаштування профілю — Шахи</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #302e2c;
            color: #bababa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* ВИПРАВЛЕНО: Збільшено верхній відступ до 130px, щоб опустити картку нижче від стелі */
            padding: 130px 20px 60px 20px;
        }

        .edit-container {
            background: #262421;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            max-height: 700px;
            margin-top: 60px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: #81b64c;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.2s;
            font-size: 1.05em;
            cursor: pointer;
        }

        .back-link:hover {
            color: #a3d96c;
        }

        .back-link::before {
            content: "← ";
            margin-right: 6px;
        }

        h2 {
            color: #fff;
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.95em;
            color: #7d7b78;
            margin-bottom: 25px;
        }

        .avatar-edit-zone {
            display: flex;
            align-items: center;
            gap: 25px;
            background: #211f1c;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1916;
            border: 2px solid #3d3b38;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.85em;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        .avatar-wrapper:hover .avatar-overlay {
            opacity: 1;
        }

        .avatar-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .avatar-title {
            color: #fff;
            font-weight: 600;
        }

        .avatar-desc {
            font-size: 0.85em;
            color: #7d7b78;
        }

        #fileInput {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #fff;
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: #1a1916;
            border: 1px solid #3d3b38;
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 1em;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #81b64c;
        }

        .action-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-save {
            background: #81b64c;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 0 #5f8933;
        }

        .btn-save:hover {
            background: #95cc5e;
        }

        .btn-save:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5f8933;
        }

        .btn-logout {
            background: transparent;
            color: #e06666;
            border: 1px solid #e06666;
            border-radius: 8px;
            padding: 11px 20px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #e06666;
            color: #fff;
        }

        .logout-confirm-zone {
            display: none;
            background: #211f1c;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4a2a2a;
            margin-top: 15px;
            text-align: center;
        }

        .logout-confirm-zone p {
            color: #fff;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .confirm-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-yes {
            background: #e06666;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-no {
            background: #3d3b38;
            color: #bababa;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-delete-photo {
            background: transparent;
            color: #e06666;
            border: 1px solid #4a2a2a;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-start;
        }

        #msg {
            margin-top: 15px;
            font-size: 0.95em;
            min-height: 1.5em;
        }
    </style>
</head>

<body>

    <div class="edit-container">
        <a href="/ui/menu.html?skipStart=true" class="back-link"
            onclick="if(typeof window.loadPageAsOverlay === 'function') { event.preventDefault(); window.loadPageAsOverlay('/ui/profile.html'); }">Скасувати</a>

        <h2>Налаштування профілю</h2>
        <p class="subtitle">Оновіть інформацію свого акаунту</p>

        <div class="avatar-edit-zone">
            <div class="avatar-wrapper" onclick="document.getElementById('fileInput').click()">
                <img id="avatarPreview" src="https://www.w3schools.com/howto/img_avatar.png" class="profile-avatar">
                <div class="avatar-overlay">Змінити<br>фото</div>
            </div>
            <div class="avatar-meta">
                <div class="avatar-title">Фото профілю</div>
                <div class="avatar-desc">Натисніть на квадрат, щоб вибрати нове фото.</div>
                <button type="button" class="btn-delete-photo" onclick="deletePhoto()">Видалити фото</button>
            </div>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="handleFilePreview()">

        <div class="form-group">
            <label>Внутрішнє ім'я (Нікнейм)</label>
            <input type="text" id="usernameField" placeholder="Ваш нікнейм">
        </div>

        <div class="form-group">
            <label>Статус профілю</label>
            <input type="text" id="statusField" placeholder="Що у вас нового?">
        </div>

        <div class="action-block">
            <button class="btn-save" onclick="saveData()">Зберегти зміни</button>
            <button id="logoutBtn" class="btn-logout" onclick="showConfirmZone()">Вийти з акаунта</button>
        </div>

        <div id="logoutConfirmZone" class="logout-confirm-zone">
            <p>Ви впевнені, що хочете вийти?</p>
            <div class="confirm-btns">
                <button class="btn-yes" onclick="confirmLogout()">Так, вийти</button>
                <button class="btn-no" onclick="hideConfirmZone()">Скасувати</button>
            </div>
        </div>

        <div id="msg"></div>
    </div>

    <script>
        (function () {
            const isFile = location.protocol === 'file:';
            const baseUrl = isFile ? 'http://127.0.0.1:8000' : `${location.protocol}//${location.host}`;
            let localSelectedFile = null;
            let isPhotoDeleted = false; // ТРИМАЄМО СТАН: чи було видалено аватарку

            window.showConfirmZone = function () {
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('logoutConfirmZone').style.display = 'block';
            };

            window.hideConfirmZone = function () {
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('logoutConfirmZone').style.display = 'none';
            };

            window.confirmLogout = function () {
                localStorage.removeItem('chess_token');
                window.location.href = '/ui/menu.html';
            };

            window.handleFilePreview = function () {
                const input = document.getElementById('fileInput');
                if (input.files && input.files[0]) {
                    localSelectedFile = input.files[0];
                    isPhotoDeleted = false; // Якщо вибрали новий файл, скидаємо прапорець видалення
                    const reader = new FileReader();
                    reader.onload = e => document.getElementById('avatarPreview').src = e.target.result;
                    reader.readAsDataURL(localSelectedFile);
                }
            };

            async function fetchCurrentData() {
                const token = localStorage.getItem('chess_token');
                if (!token) { window.location.href = '/ui/menu.html'; return; }
                try {
                    const res = await fetch(`${baseUrl}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (res.ok) {
                        const user = await res.json();
                        document.getElementById('usernameField').value = user.username || '';
                        document.getElementById('statusField').value = user.status || '';
                        if (user.avatar_url) document.getElementById('avatarPreview').src = baseUrl + user.avatar_url;
                    }
                } catch (e) { console.error("Дані не завантажено"); }
            }

            window.saveData = async function () {
                const token = localStorage.getItem('chess_token');
                const username = document.getElementById('usernameField').value.trim();
                const statusText = document.getElementById('statusField').value.trim();
                const msgBlock = document.getElementById('msg');

                if (!username) {
                    msgBlock.style.color = '#e06666';
                    msgBlock.textContent = "Нікнейм не може бути порожнім!";
                    return;
                }

                msgBlock.style.color = '#bababa';
                msgBlock.textContent = "Збереження змін...";

                const formData = new FormData();
                formData.append('username', username);
                formData.append('status_text', statusText);

                // ВИПРАВЛЕНО: Якщо юзер натиснув "Видалити фото", відправляємо пусту строку замість файлу,
                // щоб бекенд затер старий шлях в базі даних. Якщо завантажив нове — шлемо файл.
                if (isPhotoDeleted) {
                    formData.append('delete_avatar', 'true'); // або передаємо пусте поле залежно від логіки FastAPI
                    formData.append('file', '');
                } else if (localSelectedFile) {
                    formData.append('file', localSelectedFile);
                }

                try {
                    const res = await fetch(`${baseUrl}/auth/update`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        msgBlock.style.color = '#81b64c';
                        msgBlock.textContent = "Зміни збережено успішно!";
                        setTimeout(() => {
                            // ПЕРЕД ТИМ ЯК ЗАКРИТИ ОВЕРЛЕЙ, ОНОВЛЮЄМО ДАНІ НА СТОРІНЦІ ПРОФІЛЮ
                            if (window.parent && typeof window.parent.loadProfile === 'function') {
                                window.parent.loadProfile();
                            } else if (typeof window.loadProfile === 'function') {
                                window.loadProfile();
                            }
                            // Повертаємося назад на профіль
                            if (window.parent && typeof window.parent.loadPageAsOverlay === 'function') {
                                window.parent.loadPageAsOverlay('/ui/profile.html');
                            } else if (typeof window.loadPageAsOverlay === 'function') {
                                window.loadPageAsOverlay('/ui/profile.html');
                            } else {
                                window.location.href = '/ui/profile.html';
                            }
                        }, 600);
                    } else {
                        const data = await res.json();
                        msgBlock.style.color = '#e06666';
                        msgBlock.textContent = data.detail || "Помилка збереження";
                    }
                } catch (err) { console.error(err); }
            };

            window.deletePhoto = function () {
                if (confirm("Видалити фото профілю?")) {
                    document.getElementById('avatarPreview').src = 'https://www.w3schools.com/howto/img_avatar.png';
                    localSelectedFile = null;
                    isPhotoDeleted = true; // Фіксуємо факт видалення картинки
                }
            };

            fetchCurrentData();
        })();
    </script>
</body>

</html>
