<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Шахи — Гра проти бота</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <style>
        #musicToggle {
            position: fixed;
            top: 90px;
            left: 20px;

            width: 52px;
            height: 52px;

            border-radius: 14px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);

            display: none;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            cursor: pointer;
            z-index: 999;

            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.2s;
            user-select: none;
        }

        #musicToggle:hover {
            background: rgba(51, 65, 85, 0.9);
            transform: scale(1.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 16px 32px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            justify-self: start;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9em;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            transition: 0.2s;
        }

        header a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        header h1 {
            font-size: 1.25em;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        .header-right {
            justify-self: end;
            display: flex;
            gap: 15px;
        }

        .promo-piece:hover {
            border-color: #10b981 !important;
            transform: translateY(-5px);
            background: rgba(16, 185, 129, 0.1) !important;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 32px;
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .left-panel,
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px;

            display: flex;
            flex-direction: column;
        }

        .panel-card h3 {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .lvl-btn {
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lvl-btn.active {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
        }

        .level-label {
            font-size: 0.9em;
            color: #10b981;
            margin-top: 12px;
            text-align: center;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            padding: 8px;
            border-radius: 8px;
        }

        #myBoard {
            width: 500px;
            border: 4px solid #1e293b;
            border-radius: 4px;
        }

        .square-55d63 {
            background-color: #3b4c61 !important;
            border: 0.1px solid rgba(255, 255, 255, 0.05);
        }

        .square-2b130 {
            background-color: #5b6f82 !important;
            border: 0.1px solid rgba(255, 255, 255, 0.05);
        }

        .highlight-hint {
            position: relative;
        }

        .highlight-hint::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24%;
            height: 24%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
        }

        .highlight-hint.is-capture::after {
            width: 85%;
            height: 85%;
            background: transparent;
            border: 5px solid rgba(0, 0, 0, 0.15);
            border-radius: 50%;
        }

        .board-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .player-tag {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 500px;
            padding: 12px 20px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-tag.active-turn {
            border-color: rgba(37, 99, 235, 0.5);
        }

        #status {
            width: 500px;
            padding: 16px;
            text-align: center;
            font-weight: 700;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status.check {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }

        #status.player-check {
            background: rgba(37, 99, 235, 0.2);
            border-color: #3b82f6;
            color: #93c5fd;
        }

        #status.win {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #6ee7b7;
        }

        #status.lose {
            background: rgba(249, 115, 22, 0.2);
            border-color: #f97316;
            color: #fdba74;
        }

        .move-list {
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
        }

        .move-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            padding: 4px 8px;
        }

        /* ── СТИЛІ ДЛЯ КНОПОК КЕРУВАННЯ ── */
        .game-controls {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .control-btn {
            background: rgba(45, 55, 72, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(71, 85, 105, 0.8);
            color: #fff;
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .timer-display {
            margin-left: auto;
            font-family: monospace;
            font-size: 1.1em;
            font-weight: 700;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            font-size: 0.85em;
            font-weight: 600;
            color: #94a3b8;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: #94a3b8;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2563eb;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
            background-color: #fff;
        }

        input:disabled+.slider {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ДОДАНІ СТИЛІ ДЛЯ ВИБОРУ СТОРОНИ ГРИ */
        .color-selector-zone {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .color-btn {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        .color-btn.white-side {
            background: #ffffff;
            color: #1e293b;
        }

        .color-btn.random-side {
            background: linear-gradient(135deg, #ffffff 50%, #262421 50%);
            color: #ef4444;
            font-weight: 800;
        }

        .color-btn.black-side {
            background: #262421;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .color-btn:hover:not(:disabled) {
            border-color: rgba(15, 204, 100, 0.2);
            transform: translateY(-2px);
        }

        /* Стиль підсвічування обраної кнопки (зелена обводка, як на скріншоті) */
        .color-btn.active-side {
            border-color: #81b64c !important;
            box-shadow: 0 0 10px rgba(129, 182, 76, 0.4);
            transform: scale(1.05);
        }

        .color-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body>

    <div id="ytMusic" style="display:none;"></div>
    <div id="musicToggle" onclick="toggleMusic()">🔊</div>

    <header>
        <a href="/ui/menu.html?skipStart=true">← Меню</a>
        <h1>♟ Гра проти Stockfish</h1>
        <div class="header-right">
            <span id="levelBadge" style="color:#68d391; font-weight:600;"></span>
            <span id="userBadge" style="color:#90cdf4; font-weight:600;"></span>
        </div>
    </header>

    <div class="game-layout">
        <div class="left-panel">
            <div class="panel-card">
                <h3>Рівень складності</h3>
                <div class="level-grid" id="levelGrid"></div>
                <div class="level-label" id="levelName"></div>
            </div>
            <div class="panel-card">
                <button class="action-btn btn-start"
                    style="width:100%; padding:14px; border:none; border-radius:14px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer;"
                    onclick="startNewGame()">▶ Нова гра</button>

                <div class="toggle-container">
                    <span class="toggle-label">Гра з таймером (10 хв)</span>
                    <label class="switch">
                        <input type="checkbox" id="timerCheckbox" onchange="toggleTimerVisibility()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="color-selector-zone" id="colorZone">
                    <button class="color-btn white-side active-side" onclick="selectGameColor('w', this)"
                        title="Грати білими">♔</button>
                    <button class="color-btn random-side" onclick="selectGameColor('random', this)"
                        title="Випадковий колір">?</button>
                    <button class="color-btn black-side" onclick="selectGameColor('b', this)"
                        title="Грати чорними">♚</button>
                </div>
            </div>
            <div class="panel-card">
                <h3>Захоплено ботом</h3>
                <div id="capturedByBot" style="font-size:1.5em; min-height:30px;"></div>
            </div>
            <div class="panel-card">
                <h3>Захоплено вами</h3>
                <div id="capturedByHuman" style="font-size:1.5em; min-height:30px;"></div>
            </div>
        </div>

        <div class="board-area">
            <div class="player-tag">
                <span>🤖 Stockfish</span>
                <span id="botTimer" class="timer-display">10:00</span>
            </div>
            <div id="myBoard"></div>
            <div class="player-tag">
                <span>👤 Ви</span>
                <span id="humanTimer" class="timer-display">10:00</span>
            </div>
            <div id="status">Натисніть «Нова гра»</div>
        </div>

        <div class="right-panel">
            <div class="panel-card" style="flex:1;">
                <h3>Історія ходів</h3>
                <div class="move-list" id="moveList"></div>

                <div class="game-controls">
                    <button class="control-btn" onclick="resignGame()" title="Здатися">🏳</button>
                    <button class="control-btn" onclick="undoMove()" title="Хід назад">↩</button>
                    <button class="control-btn" onclick="getHint()" title="Підказка">💡</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let ytPlayer = null;
        let musicPlaying = false;
        const API_URL = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : `${location.protocol}//${location.host}`;
        let board = null, game = null, pendingPromoMove = null, currentGameId = null, currentLevel = 1, waitingForBot = false, moveHistory = [];
        const LEVEL_NAMES = { 1: '🌱 Новачок', 2: '🐣 Початківець', 3: '📗 Легкий', 4: '🎯 Нижче середнього', 5: '⚖️ Середній', 6: '🔥 Вище середнього', 7: '💪 Складний', 8: '🏆 Експерт', 9: '⚡ Майстер', 10: '💀 Гросмейстер' };

        let timerInterval = null;
        let humanTime = 600;
        let botTime = 600;
        let isTimerActive = false;

        // Змінна для збереження вибраного кольору (за замовчуванням 'w' - білі)
        let playerColor = 'w';

        const chessScript = document.createElement('script');
        chessScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js';
        document.head.appendChild(chessScript);
        chessScript.onload = () => { game = new Chess(); };

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player("ytMusic", {
                height: "0",
                width: "0",
                videoId: "r7hCJIC_y6Q",
                playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: "r7hCJIC_y6Q" },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) { console.log("Youtube Player Ready"); }

        function toggleMusic() {
            if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
            const btn = document.getElementById("musicToggle");
            if (musicPlaying) {
                ytPlayer.pauseVideo();
                btn.textContent = "🔈";
            } else {
                ytPlayer.playVideo();
                btn.textContent = "🔊";
            }
            musicPlaying = !musicPlaying;
        }

        function buildLevelGrid() {
            const grid = document.getElementById('levelGrid'); grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'lvl-btn' + (i === currentLevel ? ' active' : '');
                btn.textContent = i;
                btn.onclick = () => { if (!currentGameId) { currentLevel = i; buildLevelGrid(); } };
                grid.appendChild(btn);
            }
            document.getElementById('levelName').textContent = LEVEL_NAMES[currentLevel];
        }

        function removeHints() { $('#myBoard [class*="square-"]').removeClass('highlight-hint is-capture'); }
        function showHint(square) {
            const $square = $(`#myBoard .square-${square}`);
            if (game.get(square)) $square.addClass('highlight-hint is-capture');
            else $square.addClass('highlight-hint');
        }

        function onDragStart(source, piece) {
            if (waitingForBot || !currentGameId) return false;

            // Якщо ми граємо білими, не можна брати чорні фігури. Якщо чорними - не можна брати білі.
            if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
                (playerColor === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }

            const moves = game.moves({ square: source, verbose: true });
            moves.forEach(m => showHint(m.to));
        }

        function onDrop(source, target) {
            removeHints();
            if (waitingForBot || !currentGameId) return 'snapback';
            // Отримуємо інформацію про фігуру, яку перетягуємо
            const piece = game.get(source);
            // Робимо хід у chess.js
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            // ФІКС БАГУ: Перевіряємо наявність шаху САМЕ ТОДІ, коли хід виконано у рушії
            const isPlayerCheck = game.in_check();
            // Тільки тепер скасовуємо хід, щоб дочекатися анімації/відповіді бекенду
            game.undo();
            // Перевіряємо, чи це промоція білого пішака
            const isPawn = piece && piece.type === 'p' && piece.color === 'w';
            const isPromoRank = (target[1] === '8');
            if (isPawn && isPromoRank) {
                pendingPromoMove = { from: source, to: target };
                document.getElementById('promotionModal').style.display = 'flex';
                return 'snapback';
            }
            // Якщо це звичайний хід — передаємо правильний статус шаху
            sendMove(source + target, 'q', isPlayerCheck);
        }
        function choosePromotion(piece) {
            document.getElementById('promotionModal').style.display = 'none';
            if (!pendingPromoMove) return;
            const from = pendingPromoMove.from;
            const to = pendingPromoMove.to;
            pendingPromoMove = null;
            // Робимо хід у chess.js з обраною фігурою
            game.move({ from: from, to: to, promotion: piece });
            // ФІКС БАГУ: Перевіряємо наявність шаху ПЕРЕД undo()
            const isPlayerCheck = game.in_check();
            game.undo();
            // Відправляємо хід на бекенд
            sendMove(from + to, piece, isPlayerCheck);
        }

        function toggleTimerVisibility() {
            const isChecked = document.getElementById('timerCheckbox').checked;
            const displays = document.querySelectorAll('.timer-display');
            displays.forEach(el => el.style.display = isChecked ? 'block' : 'none');
        }

        // Функція для перемикання кнопок вибору кольору (Фронтенд-частина)
        function selectGameColor(color, element) {
            if (currentGameId) return; // Забороняємо перемикати під час активної партії

            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active-side'));
            element.classList.add('active-side');
            playerColor = color; // Записуємо вибір у змінну
        }

        function startTimerLogic() {
            clearInterval(timerInterval);
            humanTime = 600;
            botTime = 600;
            updateTimerUI();

            timerInterval = setInterval(() => {
                if (!currentGameId) return;

                // Якщо бекенд очікує відповіді від Stockfish — зменшуємо час бота
                if (waitingForBot) {
                    botTime--;
                } else {
                    // Якщо бот не думає, отже черга ходу за гравцем
                    humanTime--;
                }

                if (humanTime <= 0) {
                    clearInterval(timerInterval);
                    setStatus('ЧАС ВИЧЕРПАНО! Стокфіш переміг.', 'lose');
                    currentGameId = null;
                    unlockSettings();
                }

                if (botTime <= 0) {
                    clearInterval(timerInterval);
                    setStatus('ЧАС БОТА ВИЧЕРПАНО! Ви перемогли!', 'win');
                    currentGameId = null;
                    unlockSettings();
                }

                updateTimerUI();
            }, 1000);
        }

        function updateTimerUI() {
            const formatTime = (time) => {
                const min = Math.floor(time / 60).toString().padStart(2, '0');
                const sec = (time % 60).toString().padStart(2, '0');
                return `${min}:${sec}`;
            };
            document.getElementById('humanTimer').textContent = formatTime(humanTime);
            document.getElementById('botTimer').textContent = formatTime(botTime);
        }

        // Допоміжні функції блокування/розблокування налаштувань перед грою
        function lockSettings() {
            document.getElementById('timerCheckbox').disabled = true;
            document.querySelectorAll('.color-btn').forEach(btn => btn.disabled = true);
        }

        function unlockSettings() {
            document.getElementById('timerCheckbox').disabled = false;
            document.querySelectorAll('.color-btn').forEach(btn => btn.disabled = false);
        }

        async function startNewGame() {
            const toggle = document.getElementById("musicToggle");
            toggle.style.display = "flex";

            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo();
                musicPlaying = true;
                toggle.textContent = "🔊";
            }

            // Блокуємо галочку таймера та вибір корон під час партії
            isTimerActive = document.getElementById('timerCheckbox').checked;
            lockSettings();

            const token = localStorage.getItem('chess_token');
            const res = await fetch(`${API_URL}/game/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': token ? `Bearer ${token}` : '' },
                // ТУТ МАГІЯ: Коли буде готовий бекенд, змінна selectedColor передасть туди твій вибір ('w', 'random', 'b')
                body: JSON.stringify({ level: currentLevel, color: playerColor })
            });
            const data = await res.json();
            currentGameId = data.game_id; moveHistory = [];
            playerColor = data.player_color || 'w';

            // Встановлюємо орієнтацію дошки відповідно до кольору
            board.orientation(playerColor === 'w' ? 'white' : 'black');

            game.reset();
            if (data.fen && data.fen !== game.fen()) {
                game.load(data.fen);
                board.position(data.fen, false);
                if (data.bot_move) {
                    moveHistory.push({ h: '—', b: data.bot_move });
                }
            } else {
                board.start();
            }

            buildLevelGrid();
            setStatus('Твій хід!', '');

            if (isTimerActive) { startTimerLogic(); } else { clearInterval(timerInterval); }

            updateUI();
        }

        function setStatus(text, type) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = type;
        }

        async function sendMove(move, promotion, isPlayerCheck) {
            waitingForBot = true;
            if (isPlayerCheck) setStatus('ВИ ПОСТАВИЛИ ШАХ!', 'player-check');
            else setStatus('Stockfish думає...', '');

            game.move({ from: move.slice(0, 2), to: move.slice(2, 4), promotion: promotion });
            board.position(game.fen(), false);

            try {
                const token = localStorage.getItem('chess_token');
                const res = await fetch(`${API_URL}/game/play/${currentGameId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token ? `Bearer ${token}` : '' },
                    body: JSON.stringify({ move, promotion, level: currentLevel })
                });
                const data = await res.json();

                setTimeout(() => {
                    board.position(data.fen, true);
                    game.load(data.fen);
                    if (data.bot_move) moveHistory.push({ h: move, b: data.bot_move });

                    if (data.status === 'game_over') {
                        finishGame(data);
                    } else {
                        if (data.is_check) setStatus('ВАМ ШАХ!', 'check');
                        else if (game.in_check()) setStatus('БОТУ ШАХ!', 'player-check');
                        else setStatus('Твій хід!', '');
                    }
                    waitingForBot = false;
                    updateUI();
                }, 800);
            } catch (e) { waitingForBot = false; }
        }

        function finishGame(data) {
            if (data.result === '1-0') setStatus('Мат! Вітаю з перемогою!', 'win');
            else if (data.result === '0-1') setStatus('Мат! Stockfish переміг', 'lose');
            else setStatus('Нічия!', '');
            currentGameId = null;
            clearInterval(timerInterval);
            unlockSettings(); // Розблокуємо кнопки
        }

        async function resignGame() {
            if (!currentGameId) return;
            if (confirm("Ви впевнені, що хочете здатися?")) {
                const token = localStorage.getItem('chess_token');
                const res = await fetch(`${API_URL}/game/resign/${currentGameId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token ? `Bearer ${token}` : '' },
                });
                const data = await res.json();
                setStatus('ВИ ЗДАЛИСЯ, Stockfish переміг', 'lose');
                currentGameId = null;
                waitingForBot = false;
                clearInterval(timerInterval);
                unlockSettings(); // Розблокуємо кнопки
            }
        }

        async function undoMove() {
            if (!currentGameId || waitingForBot) return;
            const res = await fetch(`${API_URL}/game/undo/${currentGameId}`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                board.position(data.fen, true);
                game.load(data.fen);
                if (moveHistory.length > 0) moveHistory.pop();
                updateUI();
                setStatus('Хід скасовано. Твій хід!', '');
                removeHints();
            }
        }

        async function getHint() {
            if (!currentGameId || waitingForBot) return;
            setStatus('Отримання підказки...', '');
            const res = await fetch(`${API_URL}/game/hint/${currentGameId}`);
            if (res.ok) {
                const data = await res.json();
                if (data.hint) {
                    const fromSquare = data.hint.substring(0, 2);
                    const toSquare = data.hint.substring(2, 4);
                    removeHints();
                    showHint(fromSquare);
                    showHint(toSquare);
                    setStatus('Підказка отримана!', 'player-check');
                } else {
                    setStatus('Підказка недоступна.', '');
                }
            } else {
                setStatus('Помилка сервера.', 'error');
            }
        }

        function updateUI() {
            const list = document.getElementById('moveList');
            list.innerHTML = moveHistory.map((m, i) => `<div class="move-row"><span>${i + 1}.</span><span>${m.h}</span><span style="color:#93c5fd">${m.b}</span></div>`).join('');
            list.scrollTop = list.scrollHeight;

            calculateCapturedPieces();
        }

        function calculateCapturedPieces() {
            const startingPieces = {
                'p': 8, 'r': 2, 'n': 2, 'b': 2, 'q': 1, 'k': 1,
                'P': 8, 'R': 2, 'N': 2, 'B': 2, 'Q': 1, 'K': 1
            };

            const currentPieces = {
                'p': 0, 'r': 0, 'n': 0, 'b': 0, 'q': 0, 'k': 0,
                'P': 0, 'R': 0, 'N': 0, 'B': 0, 'Q': 0, 'K': 0
            };

            game.board().forEach(row => {
                row.forEach(square => {
                    if (square) {
                        const type = square.color === 'w' ? square.type.toUpperCase() : square.type.toLowerCase();
                        currentPieces[type]++;
                    }
                });
            });

            const symbols = {
                'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕',
                'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕'
            };

            let capturedByHuman = '';
            let capturedByBot = '';

            for (const key in startingPieces) {
                const diff = startingPieces[key] - currentPieces[key];
                if (diff > 0 && key !== 'k' && key !== 'K') {
                    for (let i = 0; i < diff; i++) {
                        if (key === key.toUpperCase()) {
                            capturedByBot += symbols[key] + ' ';
                        } else {
                            capturedByHuman += symbols[key] + ' ';
                        }
                    }
                }
            }

            document.getElementById('capturedByBot').innerHTML = capturedByBot || '<span style="color:#475569; font-size:0.65em; font-style:italic;">Немає фігур</span>';
            document.getElementById('capturedByHuman').innerHTML = capturedByHuman || '<span style="color:#475569; font-size:0.65em; font-style:italic;">Немає фігур</span>';
        }

        const config = {
            draggable: true, position: 'start', onDragStart, onDrop,
            moveSpeed: 'fast', snapSpeed: 0,
            onSnapEnd: () => board.position(game.fen()),
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('myBoard', config);
        buildLevelGrid();
    </script>
    <div id="promotionModal"
        style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;">
        <div class="promo-box"
            style="background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
            <h3
                style="margin: 0 0 24px; font-size: 1.1em; color: #94a3b8; font-weight: 600; text-transform: none; letter-spacing: normal;">
                Виберіть фігуру для промоції</h3>
            <div class="promo-pieces" style="display: flex; gap: 16px; justify-content: center;">
                <span class="promo-piece" onclick="choosePromotion('q')" title="Ферзь"
                    style="font-size: 64px; cursor: pointer; line-height: 1; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 12px 20px; transition: all 0.2s; background: rgba(255, 255, 255, 0.02);">♛</span>
                <span class="promo-piece" onclick="choosePromotion('r')" title="Тура"
                    style="font-size: 64px; cursor: pointer; line-height: 1; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 12px 20px; transition: all 0.2s; background: rgba(255, 255, 255, 0.02);">♜</span>
                <span class="promo-piece" onclick="choosePromotion('b')" title="Слон"
                    style="font-size: 64px; cursor: pointer; line-height: 1; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 12px 20px; transition: all 0.2s; background: rgba(255, 255, 255, 0.02);">♝</span>
                <span class="promo-piece" onclick="choosePromotion('n')" title="Кінь"
                    style="font-size: 64px; cursor: pointer; line-height: 1; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 12px 20px; transition: all 0.2s; background: rgba(255, 255, 255, 0.02);">♞</span>
            </div>
        </div>
    </div>
